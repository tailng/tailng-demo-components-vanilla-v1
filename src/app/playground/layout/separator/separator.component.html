<!-- Separator component examples. -->
<div class="separator-preview-shell separator-preview-shell--plain">
  <div class="separator-row">
    <span>Overview</span>
    <tng-separator orientation="vertical" class="separator-preview-vertical"></tng-separator>
    <span>Incidents</span>
    <tng-separator orientation="vertical" class="separator-preview-vertical"></tng-separator>
    <span>Alerts</span>
  </div>
  <tng-separator class="separator-preview-horizontal"></tng-separator>
  <p class="separator-preview-text">Apply wrapper-level spacing and let the component provide the line contract.</p>
</div>

<br>

<div class="toolbar-shell toolbar-shell--plain">
  <button type="button">All</button>
  <tng-separator orientation="vertical" class="toolbar-separator"></tng-separator>
  <button type="button">Running</button>
  <tng-separator orientation="vertical" class="toolbar-separator"></tng-separator>
  <button type="button">Archived</button>
</div>

<br>

<section class="list-shell list-shell--plain">
  <div class="list-row">Design review</div>
  <tng-separator></tng-separator>
  <div class="list-row">QA signoff</div>
  <tng-separator></tng-separator>
  <div class="list-row">Release freeze</div>
</section>
