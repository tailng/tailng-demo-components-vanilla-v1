<tng-menubar ariaLabel="Workspace commands" class="menubar-overview-plain-shell">
  <div tngMenubarGroup>
    <tng-menu #menubarOverviewPlainFileMenu="tngMenu" ariaLabel="File menu" (tngMenuSelect)="onMenubarOverviewPlainCommandSelect($event)">
      <button type="button" tngMenuItem tngMenuItemValue="Create document">New</button>
      <button type="button" tngMenuItem [tngMenuItemSubmenu]="menubarOverviewPlainImportMenu" tngMenuItemValue="Import from source">Import from...</button>
      <button type="button" tngMenuItem tngMenuItemValue="Open document">Open</button>

      <tng-menu #menubarOverviewPlainImportMenu="tngMenu" ariaLabel="Import submenu" (tngMenuSelect)="onMenubarOverviewPlainCommandSelect($event)">
        <button type="button" tngMenuItem tngMenuItemValue="Import from CSV">CSV file</button>
        <button type="button" tngMenuItem tngMenuItemValue="Import from Git">Git repository</button>
      </tng-menu>
    </tng-menu>
    <button type="button" tngMenubarItem [tngMenubarMenu]="menubarOverviewPlainFileMenu">File</button>
  </div>
  <div tngMenubarGroup>
    <tng-menu #menubarOverviewPlainViewMenu="tngMenu" ariaLabel="View menu" (tngMenuSelect)="onMenubarOverviewPlainCommandSelect($event)">
      <button type="button" tngMenuItem tngMenuItemValue="Toggle sidebar">Toggle sidebar</button>
      <button type="button" tngMenuItem tngMenuItemValue="Open command palette">Command palette</button>
    </tng-menu>
    <button type="button" tngMenubarItem [tngMenubarMenu]="menubarOverviewPlainViewMenu">View</button>
  </div>
  <button type="button" tngMenubarItem (click)="onMenubarOverviewPlainLeafSelect('Help')">Help</button>
</tng-menubar>
<br/>
<div class="menubar-examples-workspace-plain-stage menubar-examples-workspace-plain-stage--short">
  <tng-menubar ariaLabel="Wrapper workspace commands" class="menubar-examples-workspace-plain-menubar">
    <div tngMenubarGroup class="menubar-examples-workspace-plain-group">
      <tng-menu
        #workspacePlainFileMenu="tngMenu"
        ariaLabel="File menu"
        class="menubar-examples-workspace-plain-menu"
        (tngMenuSelect)="onMenubarExamplesWorkspacePlainMenuSelect($event)"
      >
        <div tngMenuGroupLabel class="menubar-examples-workspace-plain-group-label">File</div>
        <button type="button" tngMenuItem tngMenuItemValue="Create release">New release</button>
        <button type="button" tngMenuItem tngMenuItemValue="Publish release">Publish</button>
      </tng-menu>
      <button type="button" tngMenubarItem [tngMenubarMenu]="workspacePlainFileMenu">File</button>
    </div>
    <div tngMenubarGroup class="menubar-examples-workspace-plain-group">
      <tng-menu
        #workspacePlainViewMenu="tngMenu"
        ariaLabel="View menu"
        class="menubar-examples-workspace-plain-menu"
        (tngMenuSelect)="onMenubarExamplesWorkspacePlainMenuSelect($event)"
      >
        <button type="button" tngMenuItem tngMenuItemValue="Toggle sidebar">Toggle sidebar</button>
        <button type="button" tngMenuItem tngMenuItemValue="Open command palette">Command palette</button>
      </tng-menu>
      <button type="button" tngMenubarItem [tngMenubarMenu]="workspacePlainViewMenu">View</button>
    </div>
    <button type="button" tngMenubarItem>Help</button>
  </tng-menubar>
</div>
<p class="menubar-examples-workspace-plain-state">last command: {{ menubarExamplesWorkspacePlainLastCommand() }}</p>
<br/>
<div class="menubar-examples-cascade-plain-stage menubar-examples-cascade-plain-stage--cascade">
  <tng-menubar ariaLabel="Cascaded command bar" class="menubar-examples-cascade-plain-menubar">
    <div tngMenubarGroup class="menubar-examples-cascade-plain-group">
      <tng-menu
        #cascadePlainFileMenu="tngMenu"
        ariaLabel="File menu"
        class="menubar-examples-cascade-plain-menu"
        (tngMenuSelect)="onMenubarExamplesCascadePlainMenuSelect($event)"
      >
        <div tngMenuGroupLabel class="menubar-examples-cascade-plain-group-label">File</div>
        <button type="button" tngMenuItem tngMenuItemValue="Create project">Create project</button>
        <button
          type="button"
          tngMenuItem
          [tngMenuItemSubmenu]="cascadePlainImportMenu"
          tngMenuItemValue="Import from source"
        >
          Import from...
        </button>
        <div tngMenuSeparator class="menubar-examples-cascade-plain-separator"></div>
        <button type="button" tngMenuItem tngMenuItemValue="Archive project">Archive project</button>
        <tng-menu
          #cascadePlainImportMenu="tngMenu"
          ariaLabel="Import submenu"
          class="menubar-examples-cascade-plain-menu menubar-examples-cascade-plain-menu--submenu menubar-examples-cascade-plain-menu--level-1"
          (tngMenuSelect)="onMenubarExamplesCascadePlainMenuSelect($event)"
        >
          <button type="button" tngMenuItem tngMenuItemValue="Import from CSV">CSV file</button>
          <button
            type="button"
            tngMenuItem
            [tngMenuItemSubmenu]="cascadePlainGitMenu"
            tngMenuItemValue="Import from git"
          >
            Git repository
          </button>
        </tng-menu>
        <tng-menu
          #cascadePlainGitMenu="tngMenu"
          ariaLabel="Git provider submenu"
          class="menubar-examples-cascade-plain-menu menubar-examples-cascade-plain-menu--submenu menubar-examples-cascade-plain-menu--level-2"
          (tngMenuSelect)="onMenubarExamplesCascadePlainMenuSelect($event)"
        >
          <button type="button" tngMenuItem tngMenuItemValue="Import from GitHub">GitHub</button>
          <button type="button" tngMenuItem tngMenuItemValue="Import from GitLab">GitLab</button>
        </tng-menu>
      </tng-menu>
      <button type="button" tngMenubarItem [tngMenubarMenu]="cascadePlainFileMenu">File</button>
    </div>
    <div tngMenubarGroup class="menubar-examples-cascade-plain-group">
      <tng-menu
        #cascadePlainToolsMenu="tngMenu"
        ariaLabel="Tools menu"
        class="menubar-examples-cascade-plain-menu"
        (tngMenuSelect)="onMenubarExamplesCascadePlainMenuSelect($event)"
      >
        <button type="button" tngMenuItem tngMenuItemValue="Run lint">Run lint</button>
        <button type="button" tngMenuItem tngMenuItemValue="Run tests">Run tests</button>
      </tng-menu>
      <button type="button" tngMenubarItem [tngMenubarMenu]="cascadePlainToolsMenu">Tools</button>
    </div>
  </tng-menubar>
</div>
<p class="menubar-examples-cascade-plain-state">last cascaded command: {{ menubarExamplesCascadePlainLastCommand() }}</p>
