<!-- Basic Checkbox -->
<section class="doc-cmp-checkbox-overview-card">
  <tng-checkbox [checked]="true">
    Email notifications
  </tng-checkbox>
  <tng-checkbox [indeterminate]="true">
    Weekly digest (mixed)
  </tng-checkbox>
  <div class="doc-cmp-checkbox-overview-item--muted">
    <tng-checkbox
      [readonly]="true"
      [checked]="true"
    >
      Readonly legal acknowledgement
    </tng-checkbox>
  </div>
</section>

<br/>

<section class="doc-cmp-checkbox-styling-card">
  <tng-checkbox [checked]="true">
    Release checklist complete
  </tng-checkbox>
  <tng-checkbox [indeterminate]="true">
    Deployment approvals pending
  </tng-checkbox>
  <div class="doc-cmp-checkbox-styling-item--danger">
    <tng-checkbox
      [invalid]="true"
    >
      Security review required
    </tng-checkbox>
  </div>
</section>


<br/>
<section class="doc-cmp-checkbox-validation-panel">
  <tng-checkbox [invalid]="true">
    Security review is required before production deploy.
  </tng-checkbox>
</section>
