<section class="playground">
  <header class="playground-header">
    <h1>Playground</h1>
    <p class="current-route">Home</p>
  </header>

  <section class="category" *ngFor="let category of categories">
    <h2>{{ category.label }}</h2>
    <div class="card-grid">
      <article class="item-card" *ngFor="let item of category.items">
        <div class="item-card-body">
          <h3>{{ item.title }}</h3>
          <p>{{ item.description }}</p>
          <code>/{{ item.path }}</code>
        </div>
        <a [attr.href]="'/' + item.path" class="item-card-link">Open demo <span aria-hidden="true">→</span></a>
      </article>
    </div>
  </section>
</section>
